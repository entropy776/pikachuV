<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고양이 배구</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #22344a;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
// =====================================================================
//  고양이 배구 — 자몽 vs 몽자 (아이템 모드)
//  HTML + JavaScript + Canvas 만 사용 (외부 라이브러리 없음)
//  모든 좌표는 논리 해상도 860 x 480 기준이고, 화면은 브라우저 크기에 맞게 확대된다.
// =====================================================================

// ---------------------------------------------------------------------
//  1. 상수
// ---------------------------------------------------------------------
const W = 860;
const H = 480;
const DT = 1 / 120;                  // 고정 물리 스텝(초)
const GROUND_Y = 420;                // 모래 바닥 윗면 y

// 네트: 가운데 기둥, 꼭대기는 반원
const NET_X = W / 2;
const NET_HW = 5;                    // 네트 두께의 절반
const NET_TOP = 308;                 // 네트 꼭대기 y (바닥에서 112px)
const NET_CAP_Y = NET_TOP + NET_HW;  // 꼭대기 반원의 중심 y

// 공
const BALL_R = 25;                   // 반지름 (지름 50)
const BALL_G = 620;                  // 공 중력 (px/s²)
const WALL_E = 0.95;                 // 벽 반발 계수
const NET_E = 0.7;                   // 네트 반발 계수
const NET_NUDGE = 90;                // 네트 꼭대기에서 거의 수직으로 튈 때 옆으로 밀어 주는 속도

// 고양이 (판정 크기 = 공 지름의 1.5배)
const CAT_HW = BALL_R * 1.5;         // 판정 반폭 37.5 → 폭 75
const CAT_H = BALL_R * 3;            // 판정 높이 75
const CAT_G = 1330;                  // 고양이 중력
const JUMP_V = 632;                  // 점프 초속 → 최고 약 150px (네트 높이 112px)
const COURT_MIN_X = CAT_HW;                           // 왼쪽 코트에서 고양이 중심의 최소 x (벽)
const COURT_MAX_X = NET_X - NET_HW - CAT_HW;          // 최대 x (네트에 닿는 위치)
const WALK_SPEED = (COURT_MAX_X - COURT_MIN_X) / 2;   // 코트 끝 → 끝 정확히 2초 (= 175px/s)

// 슬라이딩
const SLIDE_SPEED = WALK_SPEED * 2.7;
const SLIDE_TIME = 0.42;
const SLIDE_DECEL = 0.55;            // 슬라이딩이 끝날 때 속도가 (1 - 0.55)배까지 줄어듦
const RECOVER_TIME = 0.25;           // 슬라이딩 후 일어나는 시간 (못 움직임)
const FLAT_HW = CAT_HW * 1.3;        // 납작해진 몸 반폭
const FLAT_H = CAT_H * 0.45;         // 납작해진 몸 높이
const FLAT_RC = 26;                  // 납작해진 몸 윗모서리 반지름

// 공 ↔ 고양이 충돌
const HIT_SPEED = 610;               // 맞고 튕겨 나가는 기본 속도
const CAT_VEL_K = 0.3;               // 고양이 움직임 속도가 공에 더해지는 비율
const MIN_HIT_VX = 75;               // 정중앙에 맞아도 이 정도는 네트 쪽으로 기울여 튕김
const MAX_BALL_SPEED = 860;
const HIT_COOLDOWN = 0.15;           // 한 번 맞은 뒤 다시 맞지 않는 시간
const OUCH_TIME = 0.5;               // 찡그린 표정 유지 시간

// 경기 진행
const WIN_SCORE = 11;
const SERVE_Y = 90;                  // 서브 공이 나타나는 높이
const SERVE_OFFSET = 18;             // 서브 공을 머리 중심에서 네트 쪽으로 살짝 옮겨 둠
const SERVE_HOLD = 0.6;              // 서브 공이 떨어지기 전 멈춰 있는 시간
const FIRST_SERVE_HOLD = 1.1;
const POINT_PAUSE = 1.4;             // 득점 후 다음 서브까지 쉬는 시간

// 아이템
const ITEM_R = 17;                   // 아이템 반지름
const ITEM_FALL_TIME = 3;            // 화면 위 끝 → 바닥까지 3초
const ITEM_FALL_SPEED = GROUND_Y / ITEM_FALL_TIME;   // y=-R 에서 바닥(GROUND_Y-R)까지 = GROUND_Y px
const ITEM_SPAWN_MIN = 8;            // 다음 아이템까지 8 ~ 14초 (무작위)
const ITEM_SPAWN_MAX = 14;
const ITEM_GROUND_TIME = 5;          // 바닥에 떨어진 아이템은 5초 뒤 사라짐
const EFFECT_TIME = 3;               // 스피드업 / 번개 효과 시간
const GIANT_TIME = 5;                // 거대화 효과 시간
const HIGH_JUMP_USES = 3;            // 고공점프: 높은 점프 3번
const TIMED_FX = ['speed', 'giant', 'shrink'];   // 시간으로 끝나는 효과 (고공점프는 횟수)
const ITEM_DURATION = { speed: EFFECT_TIME, giant: GIANT_TIME, shrink: EFFECT_TIME };
const SPEED_MUL = 1.6;               // 스피드업: 이동 속도 1.6배
const BALL_BOOST_TIME = 2;           // 스피드업 중에 친 공은 닿은 순간부터 2초 동안
const BALL_BOOST_SCALE = 1.5;        //   궤적을 따라 1.5배 빠르게 날아감
const GIANT_SCALE = 1.6;             // 거대화: 1.6배
const SHRINK_SCALE = 0.6;            // 번개: 상대가 0.6배
const HIGH_JUMP_V = JUMP_V * Math.SQRT2;   // 고공점프: 점프 높이 2배 (초속 √2배)
const SCALE_RATE = 2.4;              // 크기가 변하는 속도 (1 → 1.6 에 0.25초)
const ITEM_TYPES = ['speed', 'giant', 'jump', 'shrink'];
const ITEM_INFO = {
  speed:  { name: '스피드업', color: '#1fae68', light: '#7fe0ad', desc: ['3초간 빨라짐', '친 공도 2초간 빨라짐'] },
  giant:  { name: '거대화',   color: '#f2683c', light: '#ffb08f', desc: ['5초간', '몸이 커짐'] },
  jump:   { name: '고공점프', color: '#8a5cf0', light: '#c4a9ff', desc: ['3번 동안', '점프 높이 2배'] },
  shrink: { name: '번개',     color: '#2b86e8', light: '#93c8ff', desc: ['3초간', '상대가 작아짐'] },
};

// 컴퓨터(AI)
const AI_JUMP_RISE = 120;            // 점프해서 칠 때 기준 발 높이
const AI_THINK = 0.1;                // 계획을 다시 세우는 간격
// 난이도 (혼자 하기). react: 공이 맞은 뒤 반응까지 지연, late: 가끔 반응이 늦을 확률,
// err: 위치 오차(px), blunder: 낙하 지점을 크게 잘못 판단할 확률, jump: 네트 근처 공에 점프 공격할 확률
const AI_LEVELS = {
  easy:   { label: '하', name: '쉬움',   reactMin: 0.18, reactMax: 0.32, late: 0.18, err: 26, blunder: 0.22, jump: 0.2 },
  normal: { label: '중', name: '보통',   reactMin: 0.08, reactMax: 0.2,  late: 0.08, err: 16, blunder: 0.1,  jump: 0.5 },
  hard:   { label: '상', name: '어려움', reactMin: 0.05, reactMax: 0.12, late: 0.03, err: 8,  blunder: 0.04, jump: 0.7 },
};
const AI_LATE_EXTRA = 0.35;
const AI_BLUNDER_MIN = 45;
const AI_BLUNDER_MAX = 80;
const AI_DEAD = 1;                   // 목표 위치 허용 오차 (한 스텝 이동량의 절반 이상이라 좌우로 떨리지 않음)
const AI_OFF_MIN = 10;               // 닿는 순간 공보다 뒤에 서는 거리 (좋은 범위, 크기에 비례)
const AI_OFF_MAX = 36;
const AI_OFF_SAFE = 10;              // 오차가 있어도 최소 이만큼은 옆으로 비켜 섬 (정중앙 금지)
const AI_SEARCH = 90;                // 낙하 지점 좌우로 이 범위 안에서 설 위치 후보를 찾음
const AI_JUMP_ZONE = 200;            // 네트에서 이 거리 안쪽으로 오는 공만 점프 시도
const AI_JUMP_MIN_ATTACK = -20;      // 이보다 받기 쉬운 공밖에 못 만들면 점프하지 않음
const AI_SLIDE_BACK = 12;            // 슬라이딩으로 받을 때도 공보다 살짝 뒤에 몸이 오도록
const AI_ITEM_SOON = 1.6;            // 공이 이 시간 안에 내 쪽으로 올 때 스피드업/거대화 사용
const AI_ITEM_HOLD_MAX = 12;         // 아이템을 이보다 오래 들고 있으면 기회가 될 때 그냥 사용

const FONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", sans-serif';
const CAT_NAMES = ['자몽', '몽자'];

// ---------------------------------------------------------------------
//  2. 캔버스 / 화면 크기
// ---------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scaleX = 1;
let scaleY = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.max(1, Math.floor(W * s));
  const cssH = Math.max(1, Math.floor(H * s));
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  scaleX = canvas.width / W;
  scaleY = canvas.height / H;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
//  3. 유틸
// ---------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

function approach(cur, target, maxStep) {
  const d = target - cur;
  return Math.abs(d) <= maxStep ? target : cur + Math.sign(d) * maxStep;
}

// 슬라이딩 시작 후 t초 동안 미끄러지는 거리 (기본 속도 기준)
function slideDistance(t) {
  t = clamp(t, 0, SLIDE_TIME);
  return SLIDE_SPEED * (t - (SLIDE_DECEL * t * t) / (2 * SLIDE_TIME));
}
const SLIDE_REACH = slideDistance(SLIDE_TIME) + 25;

// ---------------------------------------------------------------------
//  4. 입력 (키보드 / 마우스)
// ---------------------------------------------------------------------
const keys = new Set();          // 지금 눌려 있는 키
const pressedKeys = new Set();   // 이번 스텝에 새로 눌린 키
const BLOCK_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
const P1_KEYS = { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], slide: ['KeyS'], use: ['KeyE'] };
const P2_KEYS = { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], slide: ['ArrowDown'], use: ['Enter', 'NumpadEnter'] };
// 혼자 하기에서는 자몽을 방향키 / Enter / Space 로도 조작할 수 있게 함
const P1_SOLO_KEYS = {
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  jump: ['KeyW', 'ArrowUp'], slide: ['KeyS', 'ArrowDown'],
  use: ['KeyE', 'Enter', 'NumpadEnter', 'Space'],
};

function keyCodeOf(e) {
  if (e.code) return e.code;   // 한글 입력 상태여도 e.code 는 'KeyW' 처럼 물리 키 기준
  const k = e.key || '';
  if (k === ' ' || k === 'Spacebar') return 'Space';
  if (k === 'Up' || k === 'Down' || k === 'Left' || k === 'Right') return 'Arrow' + k;
  if (k.length === 1) return 'Key' + k.toUpperCase();
  return k;
}

window.addEventListener('keydown', (e) => {
  const code = keyCodeOf(e);
  if (BLOCK_KEYS.has(code)) e.preventDefault();   // 방향키/스페이스로 페이지가 스크롤되지 않게
  if (!keys.has(code)) pressedKeys.add(code);
  keys.add(code);
  if (!e.repeat) onMenuKey(code);
}, { passive: false });

window.addEventListener('keyup', (e) => {
  const code = keyCodeOf(e);
  if (BLOCK_KEYS.has(code)) e.preventDefault();
  keys.delete(code);
}, { passive: false });

window.addEventListener('blur', () => {   // 창 전환 시 키가 눌린 채로 남지 않게
  keys.clear();
  pressedKeys.clear();
});

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
}
canvas.addEventListener('mousemove', (e) => {
  const p = toLogical(e);
  const i = buttonAt(p.x, p.y);
  if (i >= 0) menuSel = i;
  canvas.style.cursor = i >= 0 ? 'pointer' : 'default';
});
canvas.addEventListener('click', (e) => {
  const p = toLogical(e);
  const i = buttonAt(p.x, p.y);
  if (i >= 0) {
    menuSel = i;
    activateButton(i);
  }
});

// ---------------------------------------------------------------------
//  5. 게임 상태
// ---------------------------------------------------------------------
let screen = 'title';    // 'title' | 'level'(난이도 고르기) | 'game' | 'over'
let mode = 'demo';       // 'demo'(시작 화면 배경) | 'cpu' | '2p'
let aiLevel = 'normal';  // 혼자 하기 난이도: 'easy' | 'normal' | 'hard'
let phase = 'play';      // 'play' | 'point'(득점 후 잠깐 멈춤)
let phaseTimer = 0;
let score = [0, 0];
let server = 0;          // 다음 서브할 고양이 (0: 자몽, 1: 몽자)
let winner = -1;
let overTimer = 0;
let gameTime = 0;
let message = '';
let messageTimer = 0;
let messageDur = 1;
let menuSel = 0;
let DEBUG = location.hash === '#debug';   // 주소 뒤에 #debug 를 붙이면 판정 범위 표시

let fieldItem = null;    // 하늘에서 떨어지는 / 바닥에 놓인 아이템 (한 번에 하나)
let itemTimer = 0;       // 다음 아이템이 나올 때까지 남은 시간

function homeX(side) {
  const mid = (COURT_MIN_X + COURT_MAX_X) / 2;
  return side === 0 ? mid : W - mid;
}

function makeFx() {
  return { speed: 0, giant: 0, jump: 0, shrink: 0 };   // 각 효과의 남은 시간
}

function makeCat(side) {
  const x = homeX(side);
  return {
    side,
    netDir: side === 0 ? 1 : -1,   // 네트가 있는 방향 (+1: 오른쪽)
    x, y: GROUND_Y, px: x, py: GROUND_Y,
    vx: 0, vy: 0,
    onGround: true,
    state: 'normal',                // 'normal' | 'slide' | 'recover'
    slideT: 0, slideDir: 1, recoverT: 0,
    facing: side === 0 ? 1 : -1,
    hitCooldown: 0,
    ouch: 0,
    happy: 0,
    slideBuffer: 0,
    walkPhase: 0,
    landT: 0,
    blinkT: rand(1, 4),
    dustT: 0,
    item: null,                     // 가지고 있는 아이템 (하나만)
    itemHeldT: 0,
    fx: makeFx(),
    scale: 1,                       // 현재 크기 (거대화/번개로 부드럽게 변함)
  };
}
const cats = [makeCat(0), makeCat(1)];

const ball = {
  x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, angle: 0,
  held: false, holdT: 0, shotId: 0, lastHit: -1,
  boost: 0,                         // 스피드업 공: 남은 빠른 시간(초)
  trail: [],
};

// ---------------------------------------------------------------------
//  6. 아이템 효과 → 고양이 능력치
// ---------------------------------------------------------------------
function scaleTarget(giantLeft, shrinkLeft) {
  return (giantLeft > 0 ? GIANT_SCALE : 1) * (shrinkLeft > 0 ? SHRINK_SCALE : 1);
}
function speedMulOf(c) { return c.fx.speed > 0 ? SPEED_MUL : 1; }
function walkSpeedOf(c) { return WALK_SPEED * speedMulOf(c); }
function jumpVOf(c) { return c.fx.jump > 0 ? HIGH_JUMP_V : JUMP_V; }

// dist 만큼 걸어가는 데 걸리는 시간 (남은 스피드업 시간까지 고려)
function travelTime(c, dist) {
  dist = Math.max(0, dist);
  const fast = WALK_SPEED * SPEED_MUL;
  const tf = c.fx.speed;
  if (dist <= fast * tf) return dist / fast;
  return tf + (dist - fast * tf) / WALK_SPEED;
}

function useItem(c) {
  if (!c.item || phase !== 'play' || screen === 'over') return false;
  const type = c.item;
  const info = ITEM_INFO[type];
  c.item = null;
  c.itemHeldT = 0;
  if (type === 'shrink') {
    const o = cats[1 - c.side];
    o.fx.shrink = EFFECT_TIME;                     // 상대가 3초간 작아짐
    bolts.push({ side: o.side, life: 0.35, max: 0.35 });
    addPopup(o.x, o.y - CAT_H * o.scale - 22, '작아져라!', info.color);
  } else {
    // 같은 효과를 또 쓰면 처음부터 다시 채움 (고공점프는 횟수)
    c.fx[type] = type === 'jump' ? HIGH_JUMP_USES : ITEM_DURATION[type];
    addPopup(c.x, c.y - CAT_H * c.scale - 22, info.name + '!', info.color);
  }
  rings.push({ x: c.x, y: c.y - CAT_H * c.scale * 0.5, color: info.color, life: 0.4, max: 0.4 });
  return true;
}

// ---------------------------------------------------------------------
//  7. 고양이 판정 모양: 뒤집힌 U자
//     위쪽은 둥근 머리(반원), 양옆은 바닥(발)까지 내려오는 세로 벽.
//     슬라이딩 중에는 납작한 모양(윗면 평평 + 둥근 모서리)으로 바뀐다. 크기(scale)에 비례.
// ---------------------------------------------------------------------
function catFlatness(c) {
  if (c.state === 'slide') return Math.min(1, c.slideT / 0.06);
  if (c.state === 'recover') {
    const k = clamp(c.recoverT / RECOVER_TIME, 0, 1);
    return 1 - k * k * (3 - 2 * k);
  }
  return 0;
}

function catDims(c) {
  const f = catFlatness(c);
  const s = c.scale;
  const hw = lerp(CAT_HW, FLAT_HW, f) * s;
  const h = lerp(CAT_H, FLAT_H, f) * s;
  const rc = Math.min(hw, h, lerp(CAT_HW, FLAT_RC, f) * s);   // 서 있을 때 rc = hw → 완전한 반원
  return { hw, h, rc };
}

function standDims(s) {
  return { hw: CAT_HW * s, h: CAT_H * s, rc: CAT_HW * s };
}

function catBounds(c, hw) {
  return c.side === 0 ? [hw, NET_X - NET_HW - hw] : [NET_X + NET_HW + hw, W - hw];
}

// 원(중심 bx,by / 반지름 r)이 판정 모양에 닿았는지 검사.
// 닿았으면 바깥쪽 법선(nx,ny)과 파고든 깊이(pen)를 돌려준다.
function catContact(cx, feetY, d, bx, by, r) {
  const coreY = feetY - d.h + d.rc;   // 둥근 머리(모서리 원) 중심 높이
  const flat = d.hw - d.rc;           // 평평한 윗면의 절반 길이 (서 있을 땐 0)
  const dx = bx - cx;
  let nx, ny, dist;
  if (by <= coreY) {
    // 위쪽: 둥근 머리 → 닿은 위치에서 바깥으로
    const sx = cx + clamp(dx, -flat, flat);
    const ox = bx - sx;
    const oy = by - coreY;
    const len = Math.hypot(ox, oy);
    if (len > 1e-6) { nx = ox / len; ny = oy / len; } else { nx = 0; ny = -1; }
    dist = len - d.rc;
  } else if (by <= feetY) {
    // 양옆: 바닥까지 세로 벽 → 수평으로
    nx = dx >= 0 ? 1 : -1;
    ny = 0;
    dist = Math.abs(dx) - d.hw;
  } else {
    // 점프 중인 고양이의 발 아래
    const qx = cx + clamp(dx, -d.hw, d.hw);
    const ox = bx - qx;
    const oy = by - feetY;
    const len = Math.hypot(ox, oy);
    nx = ox / len;
    ny = oy / len;
    dist = len;
  }
  if (dist >= r) return null;
  return { nx, ny, pen: r - dist };
}

// 맞은 위치의 법선 방향으로 튕겨 나가는 속도 계산
function hitVelocity(nx, ny, catVx, catVy, netDir) {
  // 머리 꼭대기(법선이 위쪽) → 높이, 옆구리(법선이 옆쪽) → 낮고 옆으로
  let vx = nx * HIT_SPEED + catVx * CAT_VEL_K;   // 고양이 움직임 속도도 조금 더함
  let vy = ny * HIT_SPEED + catVy * CAT_VEL_K;
  // 버그 방지: 정중앙에 맞아 거의 수직이면 네트 쪽으로 살짝 기울인다.
  // (그대로 두면 공이 머리 위에서 무한히 수직으로 오르내릴 수 있음)
  if (Math.abs(vx) < MIN_HIT_VX) vx = netDir * MIN_HIT_VX;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_BALL_SPEED) {
    vx *= MAX_BALL_SPEED / sp;
    vy *= MAX_BALL_SPEED / sp;
  }
  return { vx, vy };
}

// ---------------------------------------------------------------------
//  8. 공 물리 (실제 게임과 AI 예측이 같은 함수를 사용)
// ---------------------------------------------------------------------
function collideNet(b) {
  const dx = b.x - NET_X;
  const minD = BALL_R + NET_HW;
  if (b.y < NET_CAP_Y) {
    // 네트 꼭대기(반원)
    const dy = b.y - NET_CAP_Y;
    const dist = Math.hypot(dx, dy);
    if (dist >= minD) return;
    let nx = 0;
    let ny = -1;
    if (dist > 1e-6) { nx = dx / dist; ny = dy / dist; }
    b.x = NET_X + nx * minD;
    b.y = NET_CAP_Y + ny * minD;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + NET_E) * vn * nx;
      b.vy -= (1 + NET_E) * vn * ny;
    }
    // 네트 꼭대기 위에서 수직으로 통통 튀며 멈추지 않도록 옆으로 밀어 줌
    if (ny < -0.7 && Math.abs(b.vx) < NET_NUDGE) b.vx = (dx < 0 ? -1 : 1) * NET_NUDGE;
  } else if (Math.abs(dx) < minD) {
    // 네트 옆면
    if (dx < 0) {
      b.x = NET_X - minD;
      if (b.vx > 0) b.vx = -b.vx * NET_E;
    } else {
      b.x = NET_X + minD;
      if (b.vx < 0) b.vx = -b.vx * NET_E;
    }
  }
}

// 공을 dt 만큼 이동 (중력 → 이동 → 좌우 벽 → 네트). 바닥에 닿으면 true
function moveBall(b, dt) {
  b.vy += BALL_G * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.x < BALL_R) {
    b.x = BALL_R;
    if (b.vx < 0) b.vx = -b.vx * WALL_E;
  } else if (b.x > W - BALL_R) {
    b.x = W - BALL_R;
    if (b.vx > 0) b.vx = -b.vx * WALL_E;
  }
  collideNet(b);
  return b.y + BALL_R >= GROUND_Y;
}

// 실제 시간 dt 만큼 공을 진행. 스피드업 공(boost)이면 같은 궤적을 1.5배 빠르게 지나감
function advanceBall(b, dt) {
  let k = 1;
  if (b.boost > 0) {
    k = BALL_BOOST_SCALE;
    b.boost = Math.max(0, b.boost - dt);   // 2초는 실제 시간으로 셈
  }
  return moveBall(b, dt * k);
}

// ---------------------------------------------------------------------
//  9. 고양이 이동
//     inp = { dir: -1|0|1, jump: bool(누르고 있음), slide: bool(이번에 눌림), use: bool(이번에 눌림) }
// ---------------------------------------------------------------------
function updateCat(c, inp, dt) {
  c.px = c.x;
  c.py = c.y;
  // 아이템 효과 시간 감소 + 크기 변화
  for (const k of TIMED_FX) if (c.fx[k] > 0) c.fx[k] = Math.max(0, c.fx[k] - dt);
  c.scale = approach(c.scale, scaleTarget(c.fx.giant, c.fx.shrink), SCALE_RATE * dt);
  if (c.item) c.itemHeldT += dt;

  c.hitCooldown = Math.max(0, c.hitCooldown - dt);
  c.ouch = Math.max(0, c.ouch - dt);
  c.happy = Math.max(0, c.happy - dt);
  c.landT = Math.max(0, c.landT - dt);
  c.blinkT -= dt;
  if (c.blinkT < -0.13) c.blinkT = rand(2, 5);
  // 공중에서 미리 누른 슬라이딩도 착지 직후 나가도록 잠깐 기억
  c.slideBuffer = inp.slide ? 0.12 : Math.max(0, c.slideBuffer - dt);

  if (c.state === 'slide') {
    c.slideT += dt;
    const k = Math.min(1, c.slideT / SLIDE_TIME);
    c.vx = c.slideDir * SLIDE_SPEED * speedMulOf(c) * (1 - SLIDE_DECEL * k);
    c.dustT -= dt;
    if (c.dustT <= 0) {
      c.dustT = 0.035;
      puff(c.x - c.slideDir * 30 * c.scale, GROUND_Y, 1, 6);
    }
    if (c.slideT >= SLIDE_TIME - 1e-9) {
      c.state = 'recover';
      c.recoverT = 0;
      c.vx = 0;
    }
  } else if (c.state === 'recover') {
    c.recoverT += dt;
    c.vx = 0;                                   // 일어나는 동안 못 움직임
    if (c.recoverT >= RECOVER_TIME - 1e-9) c.state = 'normal';
  } else {
    c.vx = inp.dir * walkSpeedOf(c);
    c.facing = inp.dir !== 0 ? inp.dir : c.netDir;
    if (c.onGround) {
      if (c.slideBuffer > 0) {
        c.state = 'slide';
        c.slideT = 0;
        c.slideBuffer = 0;
        c.dustT = 0;
        c.slideDir = inp.dir !== 0 ? inp.dir : c.facing;   // 이동 방향으로 미끄러짐
        c.facing = c.slideDir;
        c.vx = c.slideDir * SLIDE_SPEED * speedMulOf(c);
        puff(c.x, GROUND_Y, 5, 14);
      } else if (inp.jump) {
        c.vy = -jumpVOf(c);                     // 고공점프가 남아 있으면 점프 높이 2배
        if (c.fx.jump > 0) c.fx.jump--;         // 한 번 쓸 때마다 1회 차감
        c.onGround = false;
      }
    }
  }

  // 세로 이동 (중력)
  if (!c.onGround) {
    c.vy += CAT_G * dt;
    c.y += c.vy * dt;
    if (c.y >= GROUND_Y) {
      c.y = GROUND_Y;
      c.vy = 0;
      c.onGround = true;
      c.landT = 0.12;
      puff(c.x, GROUND_Y, 4, 18);
    }
  }

  // 가로 이동: 자기 코트 밖(네트 너머)으로 못 나감 (커지면 그만큼 범위가 좁아짐)
  c.x += c.vx * dt;
  const [mn, mx] = catBounds(c, catDims(c).hw);
  if (c.x < mn) c.x = mn;
  if (c.x > mx) c.x = mx;

  if (c.onGround && c.state === 'normal' && c.vx !== 0) c.walkPhase += dt * 15 * speedMulOf(c);
  else c.walkPhase = 0;
}

// ---------------------------------------------------------------------
//  10. 공 업데이트 (경기 중)
// ---------------------------------------------------------------------
function updateBall(dt) {
  const b = ball;
  b.px = b.x;
  b.py = b.y;
  let k = 1;
  if (b.held) {
    b.holdT -= dt;
    if (b.holdT <= 0) b.held = false;
  } else {
    k = b.boost > 0 ? BALL_BOOST_SCALE : 1;
    advanceBall(b, dt);
  }
  b.angle += (b.vx / BALL_R) * dt * k;   // 날아가는 방향으로 회전

  for (const c of cats) {
    if (c.hitCooldown > 0) continue;   // 맞은 직후 0.15초는 무시 (연속 충돌 방지)
    const hit = catContact(c.x, c.y, catDims(c), b.x, b.y, BALL_R);
    if (!hit) continue;
    const v = hitVelocity(hit.nx, hit.ny, c.vx, c.vy, c.netDir);
    b.vx = v.vx;
    b.vy = v.vy;
    b.x += hit.nx * (hit.pen + 0.5);   // 겹친 만큼 밖으로 밀어냄
    b.y += hit.ny * (hit.pen + 0.5);
    b.held = false;
    b.shotId++;
    b.lastHit = c.side;
    // 스피드업 중에 친 공은 지금부터 2초간 빨라짐 (스피드업이 아닌 고양이가 치면 보통 공으로)
    b.boost = c.fx.speed > 0 ? BALL_BOOST_TIME : 0;
    c.hitCooldown = HIT_COOLDOWN;
    c.ouch = OUCH_TIME;                // 0.5초 동안 찡그린 표정
    addSpark(b.x - hit.nx * BALL_R, b.y - hit.ny * BALL_R, b.boost > 0);
  }

  // 스피드업 공 잔상
  if (b.boost > 0) {
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.shift();
  } else if (b.trail.length) {
    b.trail.shift();
  }

  if (!b.held && b.y + BALL_R >= GROUND_Y) onBallLanded();
}

// 득점 후 공이 모래 위에서 통통 튀다 멈추는 연출
function updateBallLoose(dt) {
  const b = ball;
  b.px = b.x;
  b.py = b.y;
  b.boost = 0;
  if (b.trail.length) b.trail.shift();
  if (moveBall(b, dt)) {
    b.y = GROUND_Y - BALL_R;
    if (b.vy > 0) b.vy = b.vy > 120 ? -b.vy * 0.45 : 0;
    b.vx *= Math.pow(0.15, dt);
  }
  b.angle += (b.vx / BALL_R) * dt;
}

function onBallLanded() {
  const b = ball;
  b.y = GROUND_Y - BALL_R;
  b.vy = -Math.abs(b.vy) * 0.45;
  b.vx *= 0.6;
  b.boost = 0;
  const scorer = b.x < NET_X ? 1 : 0;   // 바닥에 닿은 쪽의 반대편이 1점
  puff(b.x, GROUND_Y, 14, 16);
  phase = 'point';
  phaseTimer = POINT_PAUSE;
  server = scorer;                      // 점수 낸 쪽이 다음 서브
  cats[scorer].happy = POINT_PAUSE;
  // 득점하면 사용 중인 아이템 효과는 모두 끝 (들고 있는 아이템, 떨어지는 아이템은 그대로)
  for (const c of cats) c.fx = makeFx();
  if (mode !== 'demo') {
    score[scorer]++;
    showMessage(CAT_NAMES[scorer] + ' 득점!', POINT_PAUSE - 0.1);
  }
}

function updatePoint(dt) {
  phaseTimer -= dt;
  if (phaseTimer > 0) return;
  if (mode !== 'demo' && (score[0] >= WIN_SCORE || score[1] >= WIN_SCORE)) {
    winner = score[0] >= WIN_SCORE ? 0 : 1;
    screen = 'over';
    overTimer = 0;
    menuSel = 0;
  } else {
    resetRally(SERVE_HOLD);
  }
}

// 새 랠리: 고양이는 제자리로, 공은 서브하는 고양이 머리 위에서 떨어짐.
// (아이템, 들고 있는 아이템, 남은 효과는 랠리가 바뀌어도 그대로 유지)
function resetRally(hold) {
  for (const c of cats) {
    c.x = c.px = homeX(c.side);
    c.y = c.py = GROUND_Y;
    c.vx = c.vy = 0;
    c.onGround = true;
    c.state = 'normal';
    c.slideT = c.recoverT = 0;
    c.hitCooldown = 0;
    c.ouch = 0;
    c.happy = 0;
    c.slideBuffer = 0;
    c.facing = c.netDir;
    const [mn, mx] = catBounds(c, catDims(c).hw);
    c.x = c.px = clamp(c.x, mn, mx);
  }
  const s = cats[server];
  ball.x = ball.px = s.x + s.netDir * SERVE_OFFSET;
  ball.y = ball.py = SERVE_Y;
  ball.vx = ball.vy = 0;
  ball.held = true;
  ball.holdT = hold;
  ball.boost = 0;
  ball.trail.length = 0;
  ball.shotId++;
  ball.lastHit = -1;
  phase = 'play';
  resetAI();
  pressedKeys.clear();
}

function resetItems() {
  fieldItem = null;
  itemTimer = rand(ITEM_SPAWN_MIN, ITEM_SPAWN_MAX);
  for (const c of cats) {
    c.item = null;
    c.itemHeldT = 0;
    c.fx = makeFx();
    c.scale = 1;
  }
}

function startGame(m) {
  mode = m;
  screen = 'game';
  score = [0, 0];
  server = 0;
  winner = -1;
  clearEffects();
  resetItems();
  resetRally(FIRST_SERVE_HOLD);
  showMessage('준비!', FIRST_SERVE_HOLD);
  canvas.style.cursor = 'default';
}

function goTitle() {
  mode = 'demo';
  screen = 'title';
  menuSel = 0;
  score = [0, 0];
  server = Math.random() < 0.5 ? 0 : 1;
  winner = -1;
  messageTimer = 0;
  clearEffects();
  resetItems();
  resetRally(SERVE_HOLD);
}

function showMessage(text, dur) {
  message = text;
  messageTimer = dur;
  messageDur = dur;
}

// ---------------------------------------------------------------------
//  11. 아이템: 8~14초마다 하나씩 하늘에서 떨어짐. 공중이든 바닥이든 닿으면 먹음.
// ---------------------------------------------------------------------
function spawnItem() {
  const side = Math.random() < 0.5 ? 0 : 1;       // 왼쪽/오른쪽 코트 중 무작위
  const margin = ITEM_R + 18;
  const lo = side === 0 ? margin : NET_X + NET_HW + margin;
  const hi = side === 0 ? NET_X - NET_HW - margin : W - margin;
  fieldItem = {
    type: ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)],
    x: rand(lo, hi),
    y: -ITEM_R,
    state: 'fall',          // 'fall' | 'ground'
    t: 0,                   // 바닥에서 남은 시간
    age: 0,
  };
}

function updateItems(dt) {
  if (screen !== 'over') {
    itemTimer -= dt;
    if (itemTimer <= 0 && !fieldItem) {          // 이미 하나 있으면 사라질 때까지 기다림
      spawnItem();
      itemTimer = rand(ITEM_SPAWN_MIN, ITEM_SPAWN_MAX);
    }
  }
  const it = fieldItem;
  if (!it) return;
  it.age += dt;
  if (it.state === 'fall') {
    it.y += ITEM_FALL_SPEED * dt;
    if (it.y >= GROUND_Y - ITEM_R) {
      it.y = GROUND_Y - ITEM_R;
      it.state = 'ground';
      it.t = ITEM_GROUND_TIME;
      puff(it.x, GROUND_Y, 6, 10);
    }
  } else {
    it.t -= dt;
    if (it.t <= 0) {
      fieldItem = null;
      rings.push({ x: it.x, y: it.y, color: '#ffffff', life: 0.3, max: 0.3 });
      return;
    }
  }
  // 캐릭터에 닿으면 먹음 (이미 아이템을 가지고 있는 고양이는 못 먹음)
  for (const c of cats) {
    if (c.item) continue;
    if (catContact(c.x, c.y, catDims(c), it.x, it.y, ITEM_R)) {
      c.item = it.type;
      c.itemHeldT = 0;
      fieldItem = null;
      addPopup(c.x, c.y - CAT_H * c.scale - 22, '+' + ITEM_INFO[it.type].name, ITEM_INFO[it.type].color);
      rings.push({ x: it.x, y: it.y, color: ITEM_INFO[it.type].color, life: 0.35, max: 0.35 });
      break;
    }
  }
}

// ---------------------------------------------------------------------
//  12. 컴퓨터 플레이어 (AI)
//      혼자 하기에서는 몽자(오른쪽)를 담당. 시작 화면 데모에서는 양쪽 모두.
//      코드는 netDir 로 좌우를 구분하므로 어느 쪽이든 동작한다.
// ---------------------------------------------------------------------
function makeAI() {
  return { shotId: -1, react: 0, think: 0, mode: 'wait', target: 0, recvX: null, baseX: 0, err: 0, wantJump: false, jumpPlan: null, jumpPending: false };
}
const ais = [makeAI(), makeAI()];

function resetAI() {
  for (let i = 0; i < 2; i++) {
    Object.assign(ais[i], makeAI());
    ais[i].target = homeX(i);
  }
}

// 크기/점프력에 따라 달라지는 기준 높이들
function makeProfile(s, jv) {
  return {
    s,
    hitY: GROUND_Y - CAT_H * s - BALL_R + 4 * s,       // 서 있는 머리에 공이 닿는 높이(공 중심 y)
    lowY: GROUND_Y - FLAT_H * s - BALL_R,              // 슬라이딩한 몸에 닿는 높이
    jumpY: GROUND_Y - AI_JUMP_RISE - CAT_H * s - BALL_R + 4 * s,                 // 점프해서 칠 높이
    jumpLead: (jv - Math.sqrt(jv * jv - 2 * CAT_G * AI_JUMP_RISE)) / CAT_G,      // 점프 후 그 높이까지 시간
  };
}
const BASE_PROFILE = makeProfile(1, JUMP_V);
function aiProfile(c) {
  return makeProfile(scaleTarget(c.fx.giant, c.fx.shrink), jumpVOf(c));
}

function isMySide(c, x) {
  return c.side === 0 ? x < NET_X : x > NET_X;
}

// 가상의 고양이 상태 (효과 시간과 크기 변화를 실제 게임과 똑같이 진행)
function simCat(c) {
  return { s: c.scale, g: c.fx.giant, sh: c.fx.shrink, sp: c.fx.speed, jp: c.fx.jump };
}
function simCatStep(k, dt) {
  k.g = Math.max(0, k.g - dt);
  k.sh = Math.max(0, k.sh - dt);
  k.sp = Math.max(0, k.sp - dt);
  k.s = approach(k.s, scaleTarget(k.g, k.sh), SCALE_RATE * dt);
}

function cloneBall(src) {
  return { x: src.x, y: src.y, vx: src.held ? 0 : src.vx, vy: src.held ? 0 : src.vy, boost: src.held ? 0 : src.boost };
}

// 공의 미래 궤적을 가상으로 시뮬레이션해서 떨어질 위치를 미리 계산.
//   hitX/hitT  : 서 있는 고양이 머리 높이(prof.hitY)로 내려오는 x 와 남은 시간
//   lowX/lowT  : 슬라이딩한 고양이 높이(prof.lowY)로 내려오는 x 와 남은 시간
//   jumpX/jumpT: 점프해서 칠 높이(prof.jumpY)로 내려오는 x 와 남은 시간 (없으면 null)
//   landX/landT: 바닥에 떨어지는 x 와 남은 시간
function predictBall(src, prof) {
  prof = prof || BASE_PROFILE;
  const b = cloneBall(src);
  const p = { hitX: null, hitT: 0, lowX: null, lowT: 0, jumpX: null, jumpT: 0, landX: b.x, landT: 0 };
  if (b.vy >= 0) {                     // 이미 그 높이보다 아래에서 내려오는 중
    if (b.y >= prof.hitY) p.hitX = b.x;
    if (b.y >= prof.lowY) p.lowX = b.x;
  }
  let t = 0;
  for (let i = 0; i < 720; i++) {     // 최대 6초 앞까지
    const prevY = b.y;
    const grounded = advanceBall(b, DT);
    t += DT;
    if (b.vy > 0) {                    // 내려오면서 해당 높이를 지나는 순간
      if (p.jumpX === null && prevY < prof.jumpY && b.y >= prof.jumpY) { p.jumpX = b.x; p.jumpT = t; }
      if (p.hitX === null && prevY < prof.hitY && b.y >= prof.hitY) { p.hitX = b.x; p.hitT = t; }
      if (p.lowX === null && prevY < prof.lowY && b.y >= prof.lowY) { p.lowX = b.x; p.lowT = t; }
    }
    if (grounded) { p.landX = b.x; p.landT = t; break; }
  }
  if (p.hitX === null) { p.hitX = p.landX; p.hitT = p.landT; }
  if (p.lowX === null) { p.lowX = p.landX; p.lowT = p.landT; }
  return p;
}

// 맞은 공이 날아가 떨어지는 곳까지 시뮬레이션
function finishShot(b, hit, catVy, c, k, res) {
  const v = hitVelocity(hit.nx, hit.ny, 0, catVy, c.netDir);
  b.x += hit.nx * (hit.pen + 0.5);
  b.y += hit.ny * (hit.pen + 0.5);
  b.vx = v.vx;
  b.vy = v.vy;
  b.boost = k.sp > 0 ? BALL_BOOST_TIME : 0;     // 그때 스피드업 중이면 친 공도 빨라짐
  let j = 0;
  for (; j < 720; j++) if (advanceBall(b, DT)) break;
  res.landX = b.x;
  res.flight = j * DT;
  return res;
}

// 고양이가 X 위치에 가만히 서 있다고 가정하고 공을 받아 보는 시뮬레이션.
// 닿으면 { t: 닿을 때까지 시간, ballX: 닿는 순간 공의 x, landX, flight }, 안 닿으면 null
function simulateShot(c, X) {
  const b = cloneBall(ball);
  const k = simCat(c);
  for (let i = 1; i <= 720; i++) {
    simCatStep(k, DT);
    if (advanceBall(b, DT)) return null;
    const hit = catContact(X, GROUND_Y, standDims(k.s), b.x, b.y, BALL_R);
    if (hit) return finishShot(b, hit, 0, c, k, { t: i * DT, ballX: b.x, landX: 0, flight: 0 });
  }
  return null;
}

// 점프해서 치는 시뮬레이션: 고양이가 X 에 서 있다가 tJump 초 뒤에 점프한다고 가정.
function simulateJumpShot(c, X, tJump) {
  const b = cloneBall(ball);
  const k = simCat(c);
  let cy = GROUND_Y;
  let cvy = 0;
  let jumped = false;
  for (let i = 1; i <= 720; i++) {
    simCatStep(k, DT);                                  // updateCat 과 같은 순서
    if (!jumped && i * DT >= tJump - 1e-9) { jumped = true; cvy = -(k.jp > 0 ? HIGH_JUMP_V : JUMP_V); }
    if (jumped) {
      cvy += CAT_G * DT;
      cy += cvy * DT;
      if (cy >= GROUND_Y) return null;                  // 착지할 때까지 못 맞힘
    }
    if (advanceBall(b, DT)) return null;
    const hit = catContact(X, cy, standDims(k.s), b.x, b.y, BALL_R);
    if (hit) {
      if (!jumped) return null;                         // 점프하기 전에 맞아 버림
      return finishShot(b, hit, cvy, c, k, { t: i * DT, ballX: b.x, landX: 0, flight: 0 });
    }
  }
  return null;
}

// 상대가 받기 어려운 정도: (상대와 낙하 지점 사이 거리) - (공이 떨어지기 전까지 상대가 갈 수 있는 거리)
function attackValue(c, landX, flight) {
  const o = cats[1 - c.side];
  const reach = CAT_HW * o.scale + BALL_R + walkSpeedOf(o) * Math.max(0, flight - 0.15);
  return Math.abs(landX - o.x) - reach;
}

function aiDead(c) {
  return Math.max(AI_DEAD, walkSpeedOf(c) * DT * 0.5 + 0.05);   // 스피드업 중엔 한 스텝이 커지므로 조금 넓힘
}

// 공을 받을 위치 고르기. 낙하 지점 주변 후보 위치마다 받아 보는 시뮬레이션을 해서 점수를 매긴다.
//   ① 공이 닿는 순간 고양이가 공보다 "뒤"(몽자는 오른쪽)에 있어야 함 → 정중앙/앞쪽에서 받기 금지
//   ② 제시간에 걸어서 갈 수 있는 곳
//   ③ 맞은 공이 상대 코트에 떨어지는 곳 (상대가 받기 어려운 곳일수록 조금 더 좋음)
// 결과: { x: 설 위치, rel: 닿는 순간 공보다 뒤에 있는 거리 } 또는 null(어디서도 안 닿음)
function chooseReceive(c, p, prof) {
  const back = -c.netDir;
  const [minX, maxX] = catBounds(c, CAT_HW * prof.s);
  const offMin = AI_OFF_MIN * prof.s;
  const offMax = AI_OFF_MAX * prof.s;
  const range = AI_SEARCH * Math.max(1, prof.s);
  const dead = aiDead(c);
  let best = null;
  let prevX = null;
  for (let d = -range; d <= range; d += 3) {
    const X = clamp(p.hitX + d, minX, maxX);
    if (X === prevX) continue;
    prevX = X;
    const r = simulateShot(c, X);
    if (!r) continue;
    const rel = (X - r.ballX) * back;
    let sc = 0;
    if (rel < AI_OFF_SAFE) sc -= 5000;                              // ① 정중앙/앞쪽
    else if (rel < offMin) sc -= (offMin - rel) * 4;
    else if (rel > offMax) sc -= (rel - offMax) * 4;                //    너무 뒤면 공이 낮게 깔림
    const late = travelTime(c, Math.abs(X - c.x) - dead) - r.t;
    if (late > 0) sc -= 2000 + late * 1000;                         // ② 제시간에 못 감
    if (isMySide(c, r.landX) === false) {
      sc += 1000 + clamp(attackValue(c, r.landX, r.flight), -300, 200) * 0.5;   // ③
    }
    if (!best || sc > best.score) best = { score: sc, x: X, rel };
  }
  return best;
}

// 점프 공격 계획: 점프 시점 몇 가지 × 설 위치 후보를 시뮬레이션해서
// 공보다 뒤에서 맞히고, 상대 코트에 상대가 받기 어렵게(멀리, 빠르게) 떨어지는 경우를 고른다.
// 마땅한 게 없으면 null (그냥 서서 받음)
function chooseJump(c, p, prof) {
  const back = -c.netDir;
  const [minX, maxX] = catBounds(c, CAT_HW * prof.s);
  const base = p.jumpT - prof.jumpLead;
  const dead = aiDead(c);
  let best = null;
  for (let j = -4; j <= 1; j++) {
    const tJump = base + j * 0.05;
    if (tJump < DT) continue;
    let prevX = null;
    for (let d = -30; d <= 90 * Math.max(1, prof.s); d += 5) {
      const X = clamp(p.jumpX + back * d, minX, maxX);
      if (X === prevX) continue;
      prevX = X;
      if (travelTime(c, Math.abs(X - c.x) - dead) > tJump) continue;   // 점프 전에 도착 못 함
      const r = simulateJumpShot(c, X, tJump);
      if (!r) continue;
      if ((X - r.ballX) * back < AI_OFF_SAFE) continue;                 // 공보다 뒤에서 맞혀야 함
      if (c.side === 0 ? r.landX < NET_X + 20 : r.landX > NET_X - 20) continue;   // 상대 코트로 넘어가야 함
      const sc = attackValue(c, r.landX, r.flight);                     // 클수록 받기 어려운 공
      if (!best || sc > best.score) best = { score: sc, x: X, steps: Math.ceil(tJump / DT - 1e-9) - 1 };
    }
  }
  return best && best.score > AI_JUMP_MIN_ATTACK ? best : null;
}

function inJumpZone(c, p, prof) {
  return p.jumpX !== null && p.jumpT > prof.jumpLead && Math.abs(p.jumpX - NET_X) < AI_JUMP_ZONE && isMySide(c, p.jumpX);
}

// 공이 내 쪽으로 올 때 아이템을 쓸지 판단 (번개는 공을 넘긴 직후에 따로 판단)
function aiWantsItem(c, A, p, prof) {
  const it = c.item;
  if (!it || it === 'shrink') return false;
  const holdLong = c.itemHeldT > AI_ITEM_HOLD_MAX;
  if (it === 'jump') return (A.wantJump && inJumpZone(c, p, prof)) || holdLong;   // 점프 공격 직전에
  return p.hitT < AI_ITEM_SOON || holdLong;   // 스피드업·거대화: 3초 안에 공을 받을 때
}

// 이 고양이를 조종하는 AI 의 난이도 (데모는 보통)
function aiLevelOf(c) {
  return AI_LEVELS[mode === 'cpu' ? aiLevel : 'normal'];
}

// 이번 공에서 설 위치의 오차 (+ 는 "뒤" 방향). 서브 때는 작은 오차만.
function aiError(lv, serve) {
  let e = (Math.random() + Math.random() - 1) * lv.err;   // -err ~ +err (가운데가 많음)
  // 가끔 큰 실수: 공이 더 멀리 갈 거라고 착각 → 너무 뒤에 서서 공이 앞에 떨어지거나 옆구리에 맞음
  // (앞쪽으로 크게 틀리면 정중앙에서 받게 되므로 실수는 항상 "뒤" 방향)
  if (!serve && Math.random() < lv.blunder) e += rand(AI_BLUNDER_MIN, AI_BLUNDER_MAX);
  return e;
}

function aiInput(c) {
  const A = ais[c.side];
  const inp = { dir: 0, jump: false, slide: false, use: false };
  const back = -c.netDir;                       // "뒤" = 네트 반대 방향 (몽자는 오른쪽)
  const center = homeX(c.side);                 // 내 코트 가운데
  let prof = aiProfile(c);
  let [minX, maxX] = catBounds(c, CAT_HW * prof.s);
  let p = predictBall(ball, prof);
  let mine = isMySide(c, p.hitX);               // 공이 내 코트로 내려오는가?

  // (1) 공이 새로 맞았으면: 잠깐 반응 지연 + 이번 공에서의 실수(오차) 크기를 정함
  if (ball.shotId !== A.shotId) {
    A.shotId = ball.shotId;
    const serve = ball.lastHit < 0;             // 서브 공(아직 아무도 안 맞힘)
    const lv = aiLevelOf(c);
    A.react = rand(lv.reactMin, lv.reactMax);
    if (!serve && Math.random() < lv.late) A.react += AI_LATE_EXTRA;
    A.err = aiError(lv, serve);
    A.recvX = null;
    // 서브는 점프 없이 부드럽게. 고공점프가 남아 있으면 점프 공격에 씀
    A.wantJump = !serve && (Math.random() < lv.jump || c.fx.jump > 0);
    A.jumpPlan = null;                          // 이전 공에 대한 점프 계획은 버림
    A.jumpPending = false;
    if (A.mode === 'jump') A.mode = 'receive';
    A.think = 0;
  }

  // (2) 계획 세우기: 반응 지연이 끝난 뒤 0.1초마다
  if (A.react > 0) {
    A.react -= DT;
  } else if ((A.think -= DT) <= 0) {
    A.think = AI_THINK;
    if (!mine) {
      // 내가 친 공이 상대에게 가는 중 → 번개를 쓰면 상대가 작아진 채로 받아야 함
      if (c.item === 'shrink' && ball.lastHit === c.side && cats[1 - c.side].fx.shrink <= 0) useItem(c);
      // 공이 상대 코트로 간다(상대 코트에 있다) → 내 코트 가운데로 돌아가 대기
      A.mode = 'wait';
      A.target = center;
      // 단, 그동안 내 코트에 아이템이 있으면 주우러 감
      if (!c.item && fieldItem && isMySide(c, fieldItem.x)) {
        A.mode = 'item';
        A.target = clamp(fieldItem.x, minX, maxX);
      }
    } else {
      // 공이 내 쪽으로 곧 온다 → 스피드업/거대화/고공점프를 쓸지 판단 (쓰면 효과를 반영해서 다시 계산)
      if (aiWantsItem(c, A, p, prof)) {
        const used = c.item;
        useItem(c);
        if (used === 'jump') A.wantJump = true;
        prof = aiProfile(c);
        [minX, maxX] = catBounds(c, CAT_HW * prof.s);
        p = predictBall(ball, prof);
        A.recvX = null;
      }
      // 공이 내 코트로 온다 → 떨어질 곳보다 살짝 뒤(몽자는 오른쪽)에 선다
      if (A.recvX === null || Math.abs(p.hitX - A.baseX) > 20) {
        A.baseX = p.hitX;
        const best = chooseReceive(c, p, prof);
        if (best) {
          // 실수(오차)를 더해도, 닿는 순간 공보다 최소 AI_OFF_SAFE 만큼은 뒤에 있도록 제한
          // (멈출 때 생기는 허용 오차 + 여유 2px 까지 감안) → 거의 수직으로 떨어지는 공도 정중앙에서 받지 않음
          const dead = aiDead(c);
          const err = Math.max(A.err, AI_OFF_SAFE + dead + 2 - best.rel);
          let x = clamp(best.x + back * err, minX, maxX);
          // 옮긴 위치에서 한 번 더 확인: 비스듬히 오는 공은 닿는 지점도 같이 바뀌므로 부족하면 조금 더 뒤로
          for (let k = 0; k < 2; k++) {
            const r = simulateShot(c, x);
            if (!r) break;
            const rel = (x - r.ballX) * back;
            if (rel >= AI_OFF_SAFE + dead) break;
            x = clamp(x + back * (AI_OFF_SAFE + dead + 1 - rel), minX, maxX);
          }
          A.recvX = x;
        } else {
          A.recvX = clamp(p.hitX + back * (AI_OFF_MIN + 10) * prof.s, minX, maxX);   // 어디서도 안 닿으면 기본 규칙
        }
        // 점프 공격 계획은 다음 판단 때 세움 (무거운 계산을 한 프레임에 몰지 않으려고 나눔)
        A.jumpPlan = null;
        A.jumpPending = A.wantJump;
      } else if (A.jumpPending) {
        // 가끔 점프: 네트 근처로 내려오는 높은 공이면 점프 공격을 계획
        A.jumpPending = false;
        if (inJumpZone(c, p, prof)) {
          A.jumpPlan = chooseJump(c, p, prof);
          if (A.jumpPlan) A.jumpPlan.x = clamp(A.jumpPlan.x + back * A.err * 0.4, minX, maxX);   // 점프도 약간의 오차
        }
      }
      if (A.jumpPlan) {
        A.mode = 'jump';
        A.target = A.jumpPlan.x;
      } else {
        A.mode = 'receive';
        A.target = A.recvX;
      }
    }
  }

  // (3) 목표 위치로 이동 (허용 오차 안이면 멈춤 → 좌우 떨림 방지)
  //     목표가 벽/네트 끝이면 허용 오차 없이 끝까지 붙는다 (이동 범위 제한이 멈춰 줌)
  const dead = aiDead(c);
  const dx = A.target - c.x;
  const toMax = A.target >= maxX - 0.01;
  const toMin = A.target <= minX + 0.01;
  if (dx > dead || (toMax && dx > 0)) inp.dir = 1;
  else if (dx < -dead || (toMin && dx < 0)) inp.dir = -1;
  else inp.dir = 0;

  // (4) 점프 계획이 있으면 정해 둔 순간에 점프 (자리에 제대로 섰을 때만)
  if (A.mode === 'jump' && A.jumpPlan) {
    if (A.jumpPlan.steps <= 0) {
      if (c.onGround && c.state === 'normal' && Math.abs(c.x - A.target) <= dead + 3) inp.jump = true;
      A.jumpPlan = null;            // 점프했든 못 했든 이후에는 일반 받기로
      A.wantJump = false;
      A.mode = 'receive';
      A.target = A.recvX;
    } else {
      A.jumpPlan.steps--;
    }
  }

  // (5) 멀리 떨어지는 공: 걸어서는 늦으면 슬라이딩으로 받으러 감
  if (A.mode === 'receive' && mine && A.react <= 0 && c.onGround && c.state === 'normal') {
    const need = Math.abs(A.target - c.x) - dead - 4;
    const late = travelTime(c, need) > p.hitT;                 // 머리 높이에 오기 전까지 걸어서 못 감
    if (late) {
      const mul = speedMulOf(c);
      const [fMin, fMax] = catBounds(c, FLAT_HW * prof.s);
      const tx = clamp(p.lowX + back * AI_SLIDE_BACK * prof.s, fMin, fMax);
      const D = Math.abs(tx - c.x);
      const reach = slideDistance(Math.min(p.lowT, SLIDE_TIME)) * mul;   // 지금 미끄러지면 공이 낮게 올 때까지 가는 거리
      // 지금 출발하면 공이 낮게 내려오는 순간 그 위치 근처(-30 ~ +4px)에 도착할 때 슬라이딩
      if (D > 24 && D <= SLIDE_REACH * mul && p.lowT <= SLIDE_TIME + 0.12 && reach >= D - 30 && reach <= D + 4) {
        inp.slide = true;
        inp.dir = tx > c.x ? 1 : -1;
      }
    }
  }
  return inp;
}

// ---------------------------------------------------------------------
//  13. 입력 모으기 + 한 스텝 진행
// ---------------------------------------------------------------------
function humanInput(side) {
  const map = side === 0 ? (mode === 'cpu' ? P1_SOLO_KEYS : P1_KEYS) : P2_KEYS;
  const down = (list) => list.some((k) => keys.has(k));
  const hit = (list) => list.some((k) => pressedKeys.has(k));
  return {
    dir: (down(map.right) ? 1 : 0) - (down(map.left) ? 1 : 0),
    jump: down(map.jump),
    slide: hit(map.slide),
    use: hit(map.use),
  };
}

function getInput(side) {
  const idle = { dir: 0, jump: false, slide: false, use: false };
  if (screen === 'over') return { ...idle, jump: side === winner };   // 이긴 고양이는 신나서 폴짝폴짝
  if (phase !== 'play') return { ...idle, jump: side === server };    // 득점한 고양이도 폴짝
  const isAI = mode === 'demo' || (mode === 'cpu' && side === 1);
  return isAI ? aiInput(cats[side]) : humanInput(side);   // AI 는 aiInput 안에서 직접 아이템을 씀
}

function step(dt) {
  gameTime += dt;
  if (messageTimer > 0) messageTimer -= dt;
  if (screen === 'over') overTimer += dt;
  updateClouds(dt);
  updateParticles(dt);

  const inputs = [getInput(0), getInput(1)];
  pressedKeys.clear();
  for (let i = 0; i < 2; i++) if (inputs[i].use) useItem(cats[i]);   // 아이템 키
  updateCat(cats[0], inputs[0], dt);
  updateCat(cats[1], inputs[1], dt);

  if (phase === 'play') {
    updateBall(dt);
  } else {
    updateBallLoose(dt);
    if (screen !== 'over') updatePoint(dt);
  }
  updateItems(dt);
}

// ---------------------------------------------------------------------
//  14. 메뉴 (시작 화면 / 승리 화면)
// ---------------------------------------------------------------------
function currentButtons() {
  if (screen === 'title') {
    return [
      { x: 270, y: 144, w: 320, h: 50, label: '혼자 하기 (vs 컴퓨터)', action: openLevelMenu },
      { x: 270, y: 204, w: 320, h: 50, label: '둘이 하기', action: () => startGame('2p') },
    ];
  }
  if (screen === 'level') {
    return [
      { x: 150, y: 146, w: 176, h: 62, label: '하 · 쉬움', action: () => startCpu('easy') },
      { x: 342, y: 146, w: 176, h: 62, label: '중 · 보통', action: () => startCpu('normal') },
      { x: 534, y: 146, w: 176, h: 62, label: '상 · 어려움', action: () => startCpu('hard') },
      { x: 360, y: 222, w: 140, h: 38, label: '뒤로', action: backToTitle, small: true },
    ];
  }
  if (screen === 'over') {
    return [
      { x: 290, y: 262, w: 280, h: 58, label: '다시 하기', action: () => startGame(mode) },
      { x: 320, y: 332, w: 220, h: 46, label: '처음 화면', action: goTitle, small: true },
    ];
  }
  return [];
}

function buttonAt(x, y) {
  if (screen === 'over' && overTimer < 0.5) return -1;
  const btns = currentButtons();
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return i;
  }
  return -1;
}

function activateButton(i) {
  const btns = currentButtons();
  if (btns[i]) btns[i].action();
}

function openLevelMenu() {
  screen = 'level';
  menuSel = ['easy', 'normal', 'hard'].indexOf(aiLevel);   // 지난번 고른 난이도에 커서
}

function backToTitle() {
  screen = 'title';
  menuSel = 0;
}

function startCpu(level) {
  aiLevel = level;
  startGame('cpu');
}

function onMenuKey(code) {
  if (screen === 'game') {
    if (code === 'Escape') goTitle();
    return;
  }
  if (screen === 'over' && overTimer < 0.5) return;   // 경기 끝난 직후 실수로 눌리는 것 방지
  if (screen === 'level' && code === 'Escape') { backToTitle(); return; }
  const btns = currentButtons();
  if (!btns.length) return;
  if (code === 'ArrowUp' || code === 'KeyW' || code === 'ArrowLeft' || code === 'KeyA') {
    menuSel = (menuSel + btns.length - 1) % btns.length;
  } else if (code === 'ArrowDown' || code === 'KeyS' || code === 'ArrowRight' || code === 'KeyD') {
    menuSel = (menuSel + 1) % btns.length;
  } else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') {
    activateButton(clamp(menuSel, 0, btns.length - 1));
  } else if (screen === 'title' && (code === 'Digit1' || code === 'Numpad1')) {
    openLevelMenu();
  } else if (screen === 'title' && (code === 'Digit2' || code === 'Numpad2')) {
    startGame('2p');
  } else if (screen === 'level' && /^(Digit|Numpad)[123]$/.test(code)) {
    startCpu(['easy', 'normal', 'hard'][Number(code.slice(-1)) - 1]);
  }
}

// ---------------------------------------------------------------------
//  15. 효과 (모래 먼지, 타격 반짝임, 글자, 고리, 번개, 구름)
// ---------------------------------------------------------------------
const particles = [];
const sparks = [];
const popups = [];
const rings = [];
const bolts = [];

function clearEffects() {
  particles.length = 0;
  sparks.length = 0;
  popups.length = 0;
  rings.length = 0;
  bolts.length = 0;
}

function puff(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + rand(-spread, spread), y: y - rand(0, 4),
      vx: rand(-70, 70), vy: rand(-120, -30),
      life: rand(0.3, 0.55), max: 0.55, r: rand(2, 4.5),
    });
  }
}

function addSpark(x, y, hot) {
  sparks.push({ x, y, life: 0.18, hot });
}

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, life: 1, max: 1 });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 300 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > GROUND_Y + 3) { p.y = GROUND_Y + 3; p.vy = 0; p.vx *= 0.9; }
  }
  for (const list of [sparks, popups, rings, bolts]) {
    for (let i = list.length - 1; i >= 0; i--) {
      list[i].life -= dt;
      if (list[i].life <= 0) list.splice(i, 1);
    }
  }
  for (const p of popups) p.y -= 34 * dt;
}

const clouds = [
  { x: 150, y: 120, s: 1.0, v: 8 },
  { x: 430, y: 165, s: 0.75, v: 5 },
  { x: 640, y: 110, s: 1.15, v: 10 },
  { x: 960, y: 190, s: 0.65, v: 6 },
];
function updateClouds(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 90) c.x = -90;
  }
}

// 모래 알갱이 (고정 시드로 매번 같은 무늬)
const sandDots = [];
(function makeSand() {
  let seed = 12345;
  const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 150; i++) {
    sandDots.push({
      x: r() * W,
      y: GROUND_Y + 8 + r() * (H - GROUND_Y - 12),
      r: 0.8 + r() * 1.6,
      light: r() < 0.5,
    });
  }
})();

// ---------------------------------------------------------------------
//  16. 그리기 도우미
// ---------------------------------------------------------------------
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function ellipsePath(x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
}

function outlinedText(text, x, y, size, fill, stroke, align, lw) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw || size * 0.18;
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

// ---------------------------------------------------------------------
//  17. 배경 / 네트
// ---------------------------------------------------------------------
function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(-34, 6, 20, 0, TAU);
  ctx.arc(-10, -8, 28, 0, TAU);
  ctx.arc(20, -2, 24, 0, TAU);
  ctx.arc(42, 8, 16, 0, TAU);
  ctx.fill();
  ctx.fillRect(-34, 6, 76, 18);
  ctx.beginPath();
  ctx.arc(-34, 14, 10, 0, TAU);
  ctx.arc(42, 14, 10, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawBackground() {
  // 하늘
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#5fbef5');
  sky.addColorStop(0.65, '#b5e4fb');
  sky.addColorStop(1, '#e4f6ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // 해
  ctx.fillStyle = 'rgba(255, 244, 190, 0.45)';
  ctx.beginPath(); ctx.arc(560, 92, 44, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.arc(560, 92, 30, 0, TAU); ctx.fill();

  for (const c of clouds) drawCloud(c.x, c.y, c.s);

  // 먼 언덕
  ctx.fillStyle = '#a6dc86';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(0, 318);
  ctx.quadraticCurveTo(120, 252, 250, 312);
  ctx.quadraticCurveTo(350, 352, 470, 296);
  ctx.quadraticCurveTo(590, 240, 710, 300);
  ctx.quadraticCurveTo(790, 336, W, 290);
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();

  // 가까운 언덕
  ctx.fillStyle = '#7cc760';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(0, 362);
  ctx.quadraticCurveTo(90, 330, 190, 360);
  ctx.quadraticCurveTo(300, 392, 410, 356);
  ctx.quadraticCurveTo(520, 320, 640, 362);
  ctx.quadraticCurveTo(750, 398, W, 350);
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();

  // 덤불
  ctx.fillStyle = '#5fb04a';
  for (const [bx, s] of [[70, 1], [300, 0.8], [600, 1.1], [800, 0.9]]) {
    ctx.beginPath();
    ctx.arc(bx - 14 * s, GROUND_Y - 4, 13 * s, 0, TAU);
    ctx.arc(bx, GROUND_Y - 12 * s, 16 * s, 0, TAU);
    ctx.arc(bx + 15 * s, GROUND_Y - 4, 12 * s, 0, TAU);
    ctx.fill();
  }

  // 모래 바닥
  const sand = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  sand.addColorStop(0, '#f8e0a8');
  sand.addColorStop(1, '#e8c07a');
  ctx.fillStyle = sand;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#fff1c8';
  ctx.fillRect(0, GROUND_Y, W, 3);
  for (const d of sandDots) {
    ctx.fillStyle = d.light ? 'rgba(255,248,225,0.9)' : 'rgba(205,160,95,0.7)';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fill();

}

function drawNet() {
  ctx.fillStyle = 'rgba(90, 60, 20, 0.22)';
  ellipsePath(NET_X, GROUND_Y + 4, 14, 4);
  ctx.fill();

  const x0 = NET_X - NET_HW;
  const g = ctx.createLinearGradient(x0, 0, x0 + NET_HW * 2, 0);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#c4cad3');
  ctx.beginPath();
  ctx.moveTo(x0, GROUND_Y + 2);
  ctx.lineTo(x0, NET_CAP_Y);
  ctx.arc(NET_X, NET_CAP_Y, NET_HW, Math.PI, 0);
  ctx.lineTo(NET_X + NET_HW, GROUND_Y + 2);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#ff7b7b';
  for (let y = NET_TOP + 16; y < GROUND_Y; y += 24) ctx.fillRect(x0, y, NET_HW * 2, 9);
  ctx.restore();
  ctx.strokeStyle = '#4f5866';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ---------------------------------------------------------------------
//  18. 공 그리기 (노랑·파랑·흰색 줄무늬 배구공)
// ---------------------------------------------------------------------
const BALL_COLORS = ['#ffd43b', '#2f6bd8', '#ffffff'];

function swirlFromCenter(a, R) {   // 중심 → 가장자리(각도 a)로 휘어지는 곡선
  const ca = a - 0.95;
  ctx.quadraticCurveTo(Math.cos(ca) * R * 0.62, Math.sin(ca) * R * 0.62, Math.cos(a) * R * 1.05, Math.sin(a) * R * 1.05);
}
function swirlToCenter(a, R) {
  const ca = a - 0.95;
  ctx.quadraticCurveTo(Math.cos(ca) * R * 0.62, Math.sin(ca) * R * 0.62, 0, 0);
}

function drawBallShadow(alpha) {
  const x = lerp(ball.px, ball.x, alpha);
  const y = lerp(ball.py, ball.y, alpha);
  const k = clamp(1 - (GROUND_Y - y) / 650, 0.35, 1);
  ctx.fillStyle = `rgba(90, 60, 20, ${0.28 * k})`;
  ellipsePath(x, GROUND_Y + 4, 24 * k, 5 * k);
  ctx.fill();
}

function drawBall(alpha) {
  const x = lerp(ball.px, ball.x, alpha);
  const y = lerp(ball.py, ball.y, alpha);
  const R = BALL_R;

  // 스피드업 공: 주황색 잔상과 불꽃 테두리
  const tr = ball.trail;
  for (let i = 0; i < tr.length; i++) {
    const k = (i + 1) / tr.length;
    ctx.fillStyle = `rgba(255, ${Math.round(120 + 80 * k)}, 40, ${0.35 * k})`;
    ctx.beginPath();
    ctx.arc(tr[i].x, tr[i].y, R * (0.45 + 0.5 * k), 0, TAU);
    ctx.fill();
  }

  if (y + R < 0) {   // 화면 위로 벗어나면 위치 표시
    ctx.fillStyle = '#ff5a5a';
    ctx.strokeStyle = '#2b3550';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 4);
    ctx.lineTo(x + 8, 16);
    ctx.lineTo(x - 8, 16);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    return;
  }

  ctx.save();
  ctx.translate(x, y);
  if (ball.boost > 0) {
    const glow = ctx.createRadialGradient(0, 0, R * 0.8, 0, 0, R * 1.6);
    glow.addColorStop(0, 'rgba(255, 150, 40, 0.7)');
    glow.addColorStop(1, 'rgba(255, 150, 40, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.6, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.rotate(ball.angle);
  for (let i = 0; i < 3; i++) {
    const a0 = (i * TAU) / 3;
    const a1 = a0 + TAU / 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    swirlFromCenter(a0, R);
    ctx.arc(0, 0, R * 1.05, a0, a1);
    swirlToCenter(a1, R);
    ctx.closePath();
    ctx.fillStyle = BALL_COLORS[i];
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(30, 45, 90, 0.5)';
  ctx.lineWidth = 1.4;
  for (let k = 0; k < 9; k++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    swirlFromCenter((k * TAU) / 9, R);
    ctx.stroke();
  }
  ctx.restore();

  // 입체감 (회전하지 않는 빛/그림자)
  const shade = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.05, 0, 0, R * 1.05);
  shade.addColorStop(0, 'rgba(255,255,255,0.65)');
  shade.addColorStop(0.35, 'rgba(255,255,255,0.08)');
  shade.addColorStop(0.75, 'rgba(0,0,40,0.05)');
  shade.addColorStop(1, 'rgba(0,0,40,0.3)');
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = shade;
  ctx.fill();
  ctx.strokeStyle = ball.boost > 0 ? '#ff7a1a' : '#26314d';
  ctx.lineWidth = ball.boost > 0 ? 3 : 2;
  ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------------
//  19. 아이템 그리기 (동그란 배지 + 흰색 그림)
// ---------------------------------------------------------------------
function drawItemIcon(type, x, y, r) {
  const info = ITEM_INFO[type];
  const u = r / 10;
  ctx.save();
  ctx.translate(x, y);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, info.light);
  g.addColorStop(1, info.color);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.13);
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#ffffff';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (type === 'speed') {
    // >> (빠르게)
    ctx.lineWidth = 2.4 * u;
    ctx.beginPath();
    ctx.moveTo(-5.5 * u, -5 * u); ctx.lineTo(-0.5 * u, 0); ctx.lineTo(-5.5 * u, 5 * u);
    ctx.moveTo(0.5 * u, -5 * u); ctx.lineTo(5.5 * u, 0); ctx.lineTo(0.5 * u, 5 * u);
    ctx.stroke();
  } else if (type === 'giant') {
    // ⤢ (커지기)
    ctx.lineWidth = 2.2 * u;
    ctx.beginPath(); ctx.moveTo(-4 * u, 4 * u); ctx.lineTo(4 * u, -4 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 * u, -6 * u); ctx.lineTo(0.5 * u, -6 * u); ctx.lineTo(6 * u, -0.5 * u); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6 * u, 6 * u); ctx.lineTo(-0.5 * u, 6 * u); ctx.lineTo(-6 * u, 0.5 * u); ctx.closePath(); ctx.fill();
  } else if (type === 'jump') {
    // 스프링 + 위 화살표 (높이 점프)
    ctx.lineWidth = 1.8 * u;
    ctx.beginPath();
    ctx.moveTo(-4.5 * u, 6.5 * u); ctx.lineTo(4.5 * u, 5 * u); ctx.lineTo(-4.5 * u, 3.5 * u);
    ctx.lineTo(4.5 * u, 2 * u); ctx.lineTo(-4.5 * u, 0.5 * u);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -7.5 * u); ctx.lineTo(4.5 * u, -2.5 * u); ctx.lineTo(-4.5 * u, -2.5 * u); ctx.closePath(); ctx.fill();
  } else {
    // 번개
    ctx.beginPath();
    ctx.moveTo(1.5 * u, -7.5 * u); ctx.lineTo(-4.5 * u, 1 * u); ctx.lineTo(-0.5 * u, 1 * u);
    ctx.lineTo(-2 * u, 7.5 * u); ctx.lineTo(4.5 * u, -1.5 * u); ctx.lineTo(0.5 * u, -1.5 * u);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFieldItem() {
  const it = fieldItem;
  if (!it) return;
  // 그림자 (어디로 떨어질지 보이게)
  const k = clamp(1 - (GROUND_Y - it.y) / 600, 0.35, 1);
  ctx.fillStyle = `rgba(90, 60, 20, ${0.25 * k})`;
  ellipsePath(it.x, GROUND_Y + 4, 16 * k, 4 * k);
  ctx.fill();
  if (it.state === 'ground' && it.t < 1.5 && Math.floor(it.t * 8) % 2 === 0) return;   // 곧 사라짐: 깜빡임
  const pulse = 1 + Math.sin(it.age * 7) * 0.06;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.beginPath();
  ctx.arc(it.x, it.y, (ITEM_R + 5) * pulse, 0, TAU);
  ctx.fill();
  drawItemIcon(it.type, it.x, it.y, ITEM_R);
  // 반짝이
  const sp = it.age * 3;
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 2; i++) {
    const a = sp + i * Math.PI;
    const sx = it.x + Math.cos(a) * (ITEM_R + 9);
    const sy = it.y + Math.sin(a) * (ITEM_R + 9);
    ctx.beginPath();
    ctx.moveTo(sx, sy - 4); ctx.lineTo(sx + 1.3, sy - 1.3); ctx.lineTo(sx + 4, sy); ctx.lineTo(sx + 1.3, sy + 1.3);
    ctx.lineTo(sx, sy + 4); ctx.lineTo(sx - 1.3, sy + 1.3); ctx.lineTo(sx - 4, sy); ctx.lineTo(sx - 1.3, sy - 1.3);
    ctx.closePath();
    ctx.fill();
  }
}

// ---------------------------------------------------------------------
//  20. 고양이 그리기 (Canvas 로 직접 그린 오리지널 캐릭터)
//      오른쪽을 보는 모습으로 그리고, 왼쪽을 볼 때는 좌우 반전.
//      원점 = 발 가운데, 위쪽이 -y.
// ---------------------------------------------------------------------
const CAT_LOOK = [
  { body: '#f6a13f', shade: '#e58a2c', stripe: '#d5711a', light: '#fff3dc', line: '#7a3f10', ear: '#ffb3b3', nose: '#ff7f9a' }, // 자몽
  { body: '#aab3c0', shade: '#939cab', stripe: '#8790a0', light: '#f6f8fb', line: '#3d4452', ear: '#ffc2cd', nose: '#ff92a7' }, // 몽자
];
const HEAD_X = 2;
const HEAD_Y = -44;
const HEAD_R = 31;

function headPoint(deg, rr) {
  const a = (deg * Math.PI) / 180;
  return [HEAD_X + Math.cos(a) * HEAD_R * rr, HEAD_Y + Math.sin(a) * HEAD_R * rr];
}

function drawEar(L, d1, d2, dTip) {
  const p1 = headPoint(d1, 0.86);
  const p2 = headPoint(d2, 0.86);
  const tip = headPoint(dTip, 1.5);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(tip[0], tip[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.closePath();
  ctx.fillStyle = L.body;
  ctx.fill();
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  const cx = (p1[0] + p2[0] + tip[0]) / 3;
  const cy = (p1[1] + p2[1] + tip[1]) / 3;
  const q = (pt, k) => [lerp(pt[0], cx, k), lerp(pt[1], cy, k)];
  const i1 = q(p1, 0.4);
  const i2 = q(p2, 0.4);
  const it = q(tip, 0.3);
  ctx.beginPath();
  ctx.moveTo(i1[0], i1[1]);
  ctx.lineTo(it[0], it[1]);
  ctx.lineTo(i2[0], i2[1]);
  ctx.closePath();
  ctx.fillStyle = L.ear;
  ctx.fill();
}

function drawPaw(L, x, y) {
  ellipsePath(x, y, 8.5, 5);
  ctx.fillStyle = L.light;
  ctx.fill();
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawCatFigure(c, L) {
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const sliding = c.state === 'slide';

  // 꼬리 (살랑살랑)
  const sw = Math.sin(gameTime * 3.2 + c.side * 1.7) * (sliding ? 2 : 6);
  ctx.beginPath();
  ctx.moveTo(-18, -12);
  ctx.bezierCurveTo(-44, -12, -46, -38 + sw * 0.3, -36 + sw, -58);
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 11;
  ctx.stroke();
  ctx.strokeStyle = L.body;
  ctx.lineWidth = 7;
  ctx.stroke();
  if (c.side === 0) {
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = L.stripe;
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.fillStyle = L.light;
    ctx.beginPath();
    ctx.arc(-36 + sw, -58, 3.5, 0, TAU);
    ctx.fill();
  }

  // 몸통
  ellipsePath(-1, -17, 30, 17);
  ctx.fillStyle = L.body;
  ctx.fill();
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ellipsePath(7, -12, 15, 10);
  ctx.fillStyle = L.light;
  ctx.fill();
  if (c.side === 0) {
    ctx.strokeStyle = L.stripe;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-26, -20); ctx.lineTo(-17, -22);
    ctx.moveTo(-27, -12); ctx.lineTo(-18, -13);
    ctx.stroke();
  }

  // 발 (걸을 때 번갈아 들림)
  const lift1 = c.walkPhase ? Math.max(0, Math.sin(c.walkPhase)) * 4 : 0;
  const lift2 = c.walkPhase ? Math.max(0, -Math.sin(c.walkPhase)) * 4 : 0;
  drawPaw(L, -13, -4 - lift1);
  drawPaw(L, 15, -4 - lift2);

  // 귀
  drawEar(L, -152, -106, -128);
  drawEar(L, -74, -28, -52);

  // 머리
  ctx.beginPath();
  ctx.arc(HEAD_X, HEAD_Y, HEAD_R, 0, TAU);
  ctx.fillStyle = L.body;
  ctx.fill();
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (c.side === 0) {
    // 자몽: 이마 줄무늬
    ctx.strokeStyle = L.stripe;
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(-6, -72); ctx.lineTo(-4, -63);
    ctx.moveTo(3, -74); ctx.lineTo(3, -64);
    ctx.moveTo(12, -72); ctx.lineTo(10, -63);
    ctx.stroke();
  } else {
    // 몽자: 이마에 작은 하트 무늬
    ctx.fillStyle = L.light;
    ctx.beginPath();
    ctx.moveTo(5, -60);
    ctx.bezierCurveTo(-3, -65, -2, -72, 2, -71);
    ctx.bezierCurveTo(4, -70.5, 5, -69, 5, -68);
    ctx.bezierCurveTo(5, -69, 6, -70.5, 8, -71);
    ctx.bezierCurveTo(12, -72, 13, -65, 5, -60);
    ctx.fill();
  }

  // 주둥이 (밝은 부분)
  ellipsePath(5, -35, 16, 10.5);
  ctx.fillStyle = L.light;
  ctx.fill();

  drawFace(c, L);
}

function drawFace(c, L) {
  const ouch = c.ouch > 0;
  const happy = !ouch && (c.happy > 0 || (screen === 'over' && c.side === winner));
  const ex1 = -8, ex2 = 14, ey = -47;

  // 볼 터치
  ctx.fillStyle = 'rgba(255, 120, 140, 0.45)';
  ellipsePath(-15, -37, 5.5, 3.5); ctx.fill();
  ellipsePath(24, -37, 5.5, 3.5); ctx.fill();

  // 눈
  ctx.strokeStyle = '#2a2a2a';
  ctx.fillStyle = '#2a2a2a';
  ctx.lineWidth = 2.6;
  if (ouch) {
    // > < 모양
    ctx.beginPath();
    ctx.moveTo(ex1 - 4, ey - 5); ctx.lineTo(ex1 + 4, ey); ctx.lineTo(ex1 - 4, ey + 5);
    ctx.moveTo(ex2 + 4, ey - 5); ctx.lineTo(ex2 - 4, ey); ctx.lineTo(ex2 + 4, ey + 5);
    ctx.stroke();
  } else if (happy) {
    // ^ ^ 모양
    ctx.beginPath();
    ctx.moveTo(ex1 - 5, ey + 2); ctx.quadraticCurveTo(ex1, ey - 6, ex1 + 5, ey + 2);
    ctx.moveTo(ex2 - 5, ey + 2); ctx.quadraticCurveTo(ex2, ey - 6, ex2 + 5, ey + 2);
    ctx.stroke();
  } else if (c.blinkT < 0) {
    ctx.beginPath();
    ctx.moveTo(ex1 - 4.5, ey); ctx.quadraticCurveTo(ex1, ey + 3, ex1 + 4.5, ey);
    ctx.moveTo(ex2 - 4.5, ey); ctx.quadraticCurveTo(ex2, ey + 3, ex2 + 4.5, ey);
    ctx.stroke();
  } else {
    ellipsePath(ex1, ey, 4.6, 6.2); ctx.fill();
    ellipsePath(ex2, ey, 4.6, 6.2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ex1 + 1.5, ey - 2.4, 1.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2 + 1.5, ey - 2.4, 1.8, 0, TAU); ctx.fill();
  }

  // 코
  ctx.fillStyle = L.nose;
  ctx.beginPath();
  ctx.moveTo(1.5, -40.5); ctx.lineTo(8.5, -40.5); ctx.lineTo(5, -36.8);
  ctx.closePath();
  ctx.fill();

  // 입
  ctx.strokeStyle = L.line;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  if (ouch) {
    // 지그재그 입
    ctx.moveTo(-2, -32);
    for (let i = 1; i <= 6; i++) ctx.lineTo(-2 + i * 2.6, i % 2 ? -34.6 : -32);
    ctx.stroke();
  } else if (happy) {
    ctx.moveTo(0, -34.5);
    ctx.quadraticCurveTo(5, -27, 10, -34.5);
    ctx.closePath();
    ctx.fillStyle = '#d9465f';
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.moveTo(5, -36.8); ctx.quadraticCurveTo(3, -32, 0, -34);
    ctx.moveTo(5, -36.8); ctx.quadraticCurveTo(7, -32, 10, -34);
    ctx.stroke();
  }

  // 수염
  ctx.strokeStyle = 'rgba(60, 40, 30, 0.75)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(17, -37); ctx.lineTo(40, -40);
  ctx.moveTo(17, -34); ctx.lineTo(41, -34);
  ctx.moveTo(17, -31); ctx.lineTo(39, -27);
  ctx.moveTo(-8, -37); ctx.lineTo(-31, -40);
  ctx.moveTo(-8, -34); ctx.lineTo(-32, -34);
  ctx.moveTo(-8, -31); ctx.lineTo(-30, -27);
  ctx.stroke();

  // 땀방울
  if (ouch) {
    const drop = (OUCH_TIME - c.ouch) * 14;
    ctx.save();
    ctx.translate(-31, -58 + drop);
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.bezierCurveTo(5, -2, 6, 3, 0, 5);
    ctx.bezierCurveTo(-6, 3, -5, -2, 0, -8);
    ctx.fillStyle = '#8fd3ff';
    ctx.fill();
    ctx.strokeStyle = '#3a8fd8';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ellipsePath(-1.5, 0, 1.3, 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawCatShadow(c, alpha) {
  const x = lerp(c.px, c.x, alpha);
  const y = lerp(c.py, c.y, alpha);
  const d = catDims(c);
  const k = clamp(1 - (GROUND_Y - y) / 320, 0.4, 1);
  // 아이템 효과 중이면 발밑이 그 색으로 빛남
  const active = ITEM_TYPES.filter((t) => c.fx[t] > 0);
  if (active.length) {
    const col = ITEM_INFO[active[Math.floor(gameTime * 3) % active.length]].color;
    ctx.save();
    ctx.globalAlpha = 0.45 + Math.sin(gameTime * 10) * 0.15;
    ctx.fillStyle = col;
    ellipsePath(x, GROUND_Y + 4, d.hw + 10, 8);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = `rgba(90, 60, 20, ${0.25 * k})`;
  ellipsePath(x, GROUND_Y + 4, (d.hw - 4) * k, 6 * k);
  ctx.fill();
}

function drawCat(c, alpha) {
  const x = lerp(c.px, c.x, alpha);
  const y = lerp(c.py, c.y, alpha);
  const L = CAT_LOOK[c.side];
  const d = catDims(c);
  let sx = d.hw / CAT_HW;      // 크기 + 슬라이딩 납작함이 판정과 같은 비율로 반영됨
  let sy = d.h / CAT_H;
  if (!c.onGround) {
    const k = clamp(-c.vy / JUMP_V, -1, 1) * 0.06;
    sy *= 1 + k;
    sx *= 1 - k * 0.6;
  }
  if (c.landT > 0) {
    const k = (c.landT / 0.12) * 0.08;
    sy *= 1 - k;
    sx *= 1 + k;
  }
  const bob = c.walkPhase ? Math.abs(Math.sin(c.walkPhase)) * 2.2 * c.scale : 0;

  // 슬라이딩 / 스피드업 속도선
  const lines = c.state === 'slide' ? c.slideDir : (c.fx.speed > 0 && c.vx !== 0 ? Math.sign(c.vx) : 0);
  if (lines) {
    ctx.strokeStyle = c.state === 'slide' ? 'rgba(255,255,255,0.85)' : 'rgba(31,174,104,0.8)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const lx = x - lines * (d.hw + 8 + i * 6);
      const ly = y - (8 + i * 9) * c.scale;
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - lines * 18, ly);
    }
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(x, y - bob);
  ctx.scale(sx * c.facing, sy);
  drawCatFigure(c, L);
  ctx.restore();

  // 고공점프: 발밑 스프링 반짝임 / 번개: 머리 위 작은 번개
  if (c.fx.jump > 0) {
    ctx.strokeStyle = ITEM_INFO.jump.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    const fy = y + 2;
    for (let i = 0; i < 5; i++) {
      const lx = x - 16 * c.scale + i * 8 * c.scale;
      ctx.moveTo(lx, fy);
      ctx.lineTo(lx + 4 * c.scale, fy + (i % 2 ? -5 : 5));
    }
    ctx.stroke();
  }
  if (c.fx.shrink > 0) {
    drawItemIcon('shrink', x, y - d.h - 20, 9);
  }
}

function drawItemSlot(c, x, y, keyLabel) {
  roundRectPath(x, y, 46, 46, 10);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#26314d';
  ctx.stroke();
  if (c.item) {
    drawItemIcon(c.item, x + 23, y + 23, 17);
  } else {
    ctx.font = `bold 12px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(38, 49, 77, 0.35)';
    ctx.fillText('아이템', x + 23, y + 24);
  }
  if (keyLabel) {
    ctx.font = `bold 12px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    const w = ctx.measureText(keyLabel).width + 12;
    roundRectPath(x + 23 - w / 2, y + 50, w, 17, 5);

    ctx.strokeStyle = '#26314d';
    ctx.stroke();
    ctx.fillStyle = '#26314d';
    ctx.fillText(keyLabel, x + 23, y + 63);

}

function drawActiveEffects(c, x, y, dir) {
  let i = 0;
  for (const t of ITEM_TYPES) {
    if (c.fx[t] <= 0) continue;
    const cx = x + dir * i * 30;
    ctx.beginPath();
    ctx.arc(cx, y, 13, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
    // 남은 양: 시간 효과는 남은 시간, 고공점프는 남은 횟수
    const frac = t === 'jump' ? c.fx.jump / HIGH_JUMP_USES : c.fx[t] / ITEM_DURATION[t];
    ctx.beginPath();
    ctx.arc(cx, y, 13, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.strokeStyle = ITEM_INFO[t].color;
    ctx.lineWidth = 3.5;
    ctx.stroke();
    drawItemIcon(t, cx, y, 9);
    if (t === 'jump') {
      ctx.beginPath();
      ctx.arc(cx + 10, y + 10, 7, 0, TAU);
      ctx.fillStyle = ITEM_INFO.jump.color;
      ctx.fill();
      ctx.font = `bold 10px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(c.fx.jump), cx + 10, y + 10.5);
      ctx.textBaseline = 'alphabetic';
    }
    i++;
  }
}

function drawEffects() {
  for (const p of particles) {
    ctx.fillStyle = `rgba(222, 186, 120, ${clamp(p.life / p.max, 0, 1)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  for (const s of sparks) {
    const k = 1 - s.life / 0.18;
    const r1 = 6 + k * 10;
    const r2 = 12 + k * 14;
    ctx.strokeStyle = s.hot ? `rgba(255, 150, 40, ${s.life / 0.18})` : `rgba(255, 245, 160, ${s.life / 0.18})`;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * TAU) / 8 + 0.3;
      ctx.moveTo(s.x + Math.cos(a) * r1, s.y + Math.sin(a) * r1);
      ctx.lineTo(s.x + Math.cos(a) * r2, s.y + Math.sin(a) * r2);
    }
    ctx.stroke();
  }
  for (const r of rings) {
    const k = 1 - r.life / r.max;
    ctx.save();
    ctx.globalAlpha = r.life / r.max;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 14 + k * 40, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  for (const b of bolts) {
    // 하늘에서 상대 고양이 머리 위로 번개
    const c = cats[b.side];
    const topY = c.y - catDims(c).h;
    ctx.save();
    ctx.globalAlpha = b.life / b.max;
    ctx.strokeStyle = '#fff59a';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let lx = c.x + 18;
    ctx.moveTo(lx, 0);
    for (let yy = 40; yy < topY; yy += 40) {
      lx = c.x + ((yy / 40) % 2 ? -14 : 14);
      ctx.lineTo(lx, yy);
    }
    ctx.lineTo(c.x, topY);
    ctx.stroke();
    ctx.strokeStyle = ITEM_INFO.shrink.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
  for (const p of popups) {
    ctx.save();
    ctx.globalAlpha = clamp(p.life / 0.3, 0, 1);
    outlinedText(p.text, p.x, p.y, 20, p.color, '#ffffff', 'center', 5);
    ctx.restore();
  }
}

function drawHitboxes() {
  ctx.save();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255, 0, 0, 0.9)';
  for (const c of cats) {
    const d = catDims(c);
    const coreY = c.y - d.h + d.rc;
    const flat = d.hw - d.rc;
    ctx.beginPath();
    ctx.moveTo(c.x - d.hw, c.y);
    ctx.lineTo(c.x - d.hw, coreY);
    ctx.arc(c.x - flat, coreY, d.rc, Math.PI, Math.PI * 1.5);
    ctx.lineTo(c.x + flat, coreY - d.rc);
    ctx.arc(c.x + flat, coreY, d.rc, Math.PI * 1.5, TAU);
    ctx.lineTo(c.x + d.hw, c.y);
    ctx.stroke();
    const isAI = mode === 'demo' || (mode === 'cpu' && c.side === 1);
    if (isAI) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.fillRect(ais[c.side].target - 2, GROUND_Y + 8, 4, 14);
    }
  }
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, TAU);
  ctx.stroke();
  if (fieldItem) {
    ctx.beginPath();
    ctx.arc(fieldItem.x, fieldItem.y, ITEM_R, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function render(alpha) {
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  const menu = screen === 'title' || screen === 'level';
  drawBackground();
  if (!menu) drawScore();
  drawNet();
  drawCatShadow(cats[0], alpha);
  drawCatShadow(cats[1], alpha);
  drawBallShadow(alpha);
  drawCat(cats[0], alpha);
  drawCat(cats[1], alpha);
  drawFieldItem();
  drawBall(alpha);
  drawEffects();
  if (DEBUG) drawHitboxes();
  drawMessage();
  if (menu) drawTitle();
  else if (screen === 'over') drawOver();
}

// ---------------------------------------------------------------------
//  22. 메인 루프 (고정 스텝 물리 + 보간 렌더링)
// ---------------------------------------------------------------------
let lastTime = performance.now();
let acc = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;      // 탭 전환 등으로 오래 멈췄을 때 한꺼번에 몰아서 계산하지 않음
  acc += dt;
  let n = 0;
  while (acc >= DT && n < 24) {
    step(DT);
    acc -= DT;
    n++;
  }
  render(clamp(acc / DT, 0, 1));
  requestAnimationFrame(frame);
}

goTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
